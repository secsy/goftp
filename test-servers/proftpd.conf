# proftpd for the goftp test suite.
#
# Extracted from the heredoc in the old build_test_server.sh, with the
# paths pointing inside the container rather than at whatever directory
# the script happened to run in.

# Debian ships mod_tls as a separate package and loads modules from a
# list, so it has to be asked for by name here.
LoadModule              mod_tls.c

ServerType              standalone
Port                    2124
DefaultAddress          0.0.0.0
User                    goftp
Group                   goftp

AuthUserFile            /etc/proftpd/users.txt
AuthOrder               mod_auth_file.c
RequireValidShell       off

PidFile                 /dev/null
ScoreboardFile          /dev/null
UseReverseDNS           off

# The tests upload, overwrite and resume, all of which are refused by
# default.
AllowStoreRestart       on
AllowOverwrite          on
AllowRetrieveRestart    on

DefaultRoot             /testroot

# A bounded passive range, so the ports a transfer needs are the ports
# the compose file publishes. Without one the server picks anything.
PassivePorts            30200 30299

<IfModule mod_tls.c>
  TLSEngine             on
  TLSRSACertificateFile     /etc/proftpd/ftpd.crt
  TLSRSACertificateKeyFile  /etc/proftpd/ftpd.key
  TLSVerifyClient       off
  # The tests open data connections independently of the control one, so
  # requiring the session to be reused would refuse every transfer.
  TLSOptions            NoSessionReuseRequired
</IfModule>
